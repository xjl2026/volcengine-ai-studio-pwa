<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>AI视频导演工作台 · Mobile Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef1f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#10131af2;backdrop-filter:blur(16px);border-bottom:1px solid #252b37;padding:10px 12px}.brand{font-weight:800;font-size:13px}.brand small{display:block;color:#7f899b;font-weight:500;margin-top:3px}.nav{display:flex;gap:6px;overflow:auto;margin-top:9px;padding-bottom:2px}.nav::-webkit-scrollbar{display:none}.nav button{flex:none;border:1px solid #2b3341;background:#171c25;color:#aab3c2;border-radius:9px;padding:8px 10px;font-size:11px}.nav button.active{background:#edf1f7;color:#11151d}.wrap{padding:14px 14px 70px;max-width:1100px;margin:auto}.banner{padding:10px 12px;border:1px solid #3b4658;border-radius:10px;background:#151d28;color:#a9b6c9;font-size:11px;line-height:1.5;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.head h1{font-size:23px;margin:0}.head p{margin:6px 0 0;color:#8792a5;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:#edf1f7;color:#11151d}.secondary{background:#202634;color:#dce2ec}.danger{background:#311a20;color:#f1bec6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{border:1px solid #262d39;background:#12161f;border-radius:14px;padding:16px}.card h3,.panel h3{margin:0 0 10px;font-size:15px}.muted{color:#7f899b;font-size:12px;line-height:1.55}.eyebrow{font-size:9px;letter-spacing:.12em;color:#718096}.field{margin:12px 0;line-height:1.55;font-size:13px}.field b{display:block;color:#8994a7;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#202635;color:#bdc6d4;font-size:10px}.status{float:right}.status.READY{background:#2d2816;color:#e8d48f}.status.REVIEW{background:#2e2037;color:#dab8e8}.status.LOCKED{background:#173124;color:#bee8cc}.status.DESIGN{background:#252a33;color:#a5afbf}.status.IN_PRODUCTION{background:#18283a;color:#aacced}.north{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.north div{border:1px solid #2b3340;background:#141922;border-radius:12px;padding:14px}.north b{display:block;color:#8793a5;font-size:10px;margin-bottom:6px}.north span{font-size:13px;line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.metrics div{border:1px solid #252c38;background:#10141b;border-radius:11px;padding:12px}.metrics b{display:block;font-size:21px}.metrics span{font-size:10px;color:#7f899b}form{margin:0}label{display:grid;gap:6px;margin:12px 0;color:#a9b2c1;font-size:12px}input,textarea,select{width:100%;background:#0e1218;color:#fff;border:1px solid #313846;border-radius:8px;padding:10px}textarea{min-height:88px;resize:vertical}.sectionTitle{margin:24px 0 10px;font-size:16px}.shot{cursor:pointer}.shot.selected{border-color:#65718a}.next{border:1px solid #3c485c;background:#151d29;border-radius:14px;padding:15px;margin-bottom:12px}.next b{display:block;font-size:10px;color:#7d8da3}.next span{display:block;font-size:19px;font-weight:800;margin-top:6px}.timeline{border-left:1px solid #343d4c;margin-left:5px;padding-left:14px}.timeline div{margin:0 0 14px}.timeline small{color:#6e7a8e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.empty{padding:36px;text-align:center;border:1px dashed #303846;border-radius:12px;color:#748095}.hidden{display:none!important}.filePreview{max-width:100%;max-height:220px;border-radius:9px;background:#050608}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#edf1f7;color:#10131a;padding:10px 14px;border-radius:9px;font-weight:700;font-size:12px;z-index:99;display:none}
@media(max-width:760px){.wrap{padding:12px 12px 70px}.grid,.north{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.card,.panel{padding:14px}.nav button{font-size:10px}}
</style></head><body>
<div class="top"><div class="brand">AI VIDEO DIRECTOR<small>V0.7 · Mobile Pages Demo · 数据仅保存在当前浏览器</small></div><div class="nav" id="nav"></div></div>
<div class="wrap"><div class="banner">手机体验版。这里用于测试导演流程、Shot Workspace、资产回流、审片与决策沉淀；不连接正式后端，不保存 API Key，不直连 Seedance。</div><div class="head"><div><h1 id="title">控制台</h1><p id="subtitle"></p></div><div class="actions"><button class="btn secondary" id="exportBtn">导出JSON</button><button class="btn secondary" id="resetBtn">重置Demo</button></div></div><div id="view"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='avdw-mobile-demo-v07-single';
const now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID?.()||Date.now()+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['dashboard','控制台'],['bible','Bible'],['shots','Shots'],['workspace','Workspace'],['assets','资产'],['production','生产回流'],['review','审片'],['decisions','决策']];
function seed(){const s1=uid(),s2=uid();return{project:{id:uid(),name:'龙宫穿越｜手机 Demo',brief:'制作一条沉浸式东方神话海底龙宫奇观短片',coreExperience:'巨大、丰富、活着的海底文明；第一人称穿越感持续升级',finalMemory:'核心主殿上方的透明金色龙珠，东方巨龙明确盘踞在龙珠内部',story:'摄影机进入龙宫王城，空间持续升级，最终抵达核心并揭示龙珠内部巨龙。',platform:'抖音',format:'9:16',finalAssetId:''},bible:{theme:'沉浸式东方神话奇观',world:'龙宫是一整座巨大、密集、活着的海底文明',character:'摄影机就是观众；完整真龙最终揭示前不得完整出现',tone:'深海蓝 + 克制金色，高预算东方神话史诗电影感',continuity:'尺度持续升级；生态与建筑融合；结尾不能爆白'},shots:[{id:s1,name:'S01｜王城展开',purpose:'第一次让观众意识到龙宫是一整座王城',start:'视野被两侧巨大宫殿夹住',motion:'狭窄穿行 → 快速拉升 → 巨大开放空间',end:'整座海底王城完整进入视野',camera:'FPV 低空贴近建筑穿行后快速拉升',blocking:'摄影机从宫道中央穿出，贴近柱体后抬升',visual:'王城从近景遮挡中突然完整展开',sound:'音乐第一次打开',status:'READY'},{id:s2,name:'S02｜龙珠揭示',purpose:'完成全片终极记忆点',start:'摄影机刚穿出最后一片神柱区域',motion:'高速穿越 → 明显减速 → 稳定靠近',end:'龙珠居中，球内巨龙清楚可见，画面稳定停住',camera:'进入核心空间后减速抬头并稳定靠近龙珠',blocking:'镜头保持龙珠中心构图，巨龙在球内缓慢转头',visual:'核心主殿 + 透明金色龙珠 + 球内盘踞东方巨龙',sound:'音乐收住后进入高潮',status:'DESIGN'}],assets:[],generations:[],reviews:[],decisions:[{id:uid(),shotId:s2,title:'完整真龙只在结尾出现',decision:'中段只允许龙影或局部预兆；完整巨龙只在最终龙珠揭示时出现',reason:'避免提前消耗终极揭示',status:'LOCKED',createdAt:now()}],selectedShot:s1}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();
let current='dashboard';const $=s=>document.querySelector(s);function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1500)}
function statusCount(s){return db.shots.filter(x=>x.status===s).length}function shot(id){return db.shots.find(x=>x.id===id)}function selected(){return shot(db.selectedShot)||db.shots[0]}
function nav(){const n=$('#nav');n.innerHTML=tabs.map(([k,t])=>`<button class="${current===k?'active':''}" data-tab="${k}">${t}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()})}
function compilePrompt(s){const ds=db.decisions.filter(d=>d.status!=='SUPERSEDED'&&(!d.shotId||d.shotId===s.id));return[`【故事合同】\n${db.project.story}`,`【核心体验】\n${db.project.coreExperience}`,`【最终记忆点】\n${db.project.finalMemory}`,`【世界规则】\n${db.bible.world}`,`【人物 / 主体规则】\n${db.bible.character}`,ds.length?`【已锁定导演决策】\n${ds.map(d=>'- '+d.title+'：'+d.decision).join('\n')}`:'',`【镜头目的】\n${s.purpose}`,`【状态变化】\n开始：${s.start}\n主要变化：${s.motion}\n结束：${s.end}`,`【Blocking】\n${s.blocking}`,`【摄影】\n${s.camera}`,`【画面设计】\n${s.visual}`,`【声音关系】\n${s.sound}`,`【执行纪律】\n只执行当前 Shot 已锁定的导演设计，结束状态必须可观察。`].filter(Boolean).join('\n\n')}
function shotNext(s){if(s.status==='DESIGN')return['先把导演设计锁完整','把 Purpose / Camera / Motion / Blocking / Start / End 全部明确。'];if(s.status==='REVIEW')return['现在只做审片和诊断','判断 Keep / Fix in Post / Edit / Reroll / Rewrite。'];if(s.status==='LOCKED')return['这个 Shot 已锁定','不要无理由重抽，继续推进下一个 Shot。'];if(!db.generations.some(g=>g.shotId===s.id))return['执行这一轮生产','可以去任何外部平台生成，回来登记到当前 Shot。'];return['检查上一轮结果','已有 Generation，先完成审片再决定下一轮。']}
function dashboard(){const p=db.project;return`<div class="north"><div><b>创作目标</b><span>${esc(p.brief)}</span></div><div><b>核心体验</b><span>${esc(p.coreExperience)}</span></div><div><b>最终记忆点</b><span>${esc(p.finalMemory)}</span></div></div><div class="metrics"><div><b>${db.shots.length}</b><span>镜头</span></div><div><b>${statusCount('LOCKED')}</b><span>已锁 Shot</span></div><div><b>${db.assets.length}</b><span>资产</span></div><div><b>${db.decisions.length}</b><span>关键决策</span></div></div><div class="grid"><div class="panel"><h3>Shot Production｜做到哪</h3>${db.shots.map(s=>`<div class="field"><b>${esc(s.name)}</b><span class="badge status ${s.status}">${s.status}</span>${esc(s.purpose)}</div>`).join('')}<button class="btn secondary" id="goWorkspace">进入镜头工作区</button></div><div class="panel"><h3>产品原则</h3><div class="field"><b>Single Source of Truth</b>外部工具负责生成，工作台负责记住这支片怎么被导演出来。</div><div class="field"><b>Diagnose Before Regenerate</b>失败先诊断，再决定 Edit / Reroll / Rewrite。</div><div class="field"><b>All Decisions Return</b>已经锁定的决定要进入下一轮执行。</div></div></div>`}
function bible(){return`<div class="panel"><h3>Project North Star</h3><form id="bibleForm"><label>创作目标<textarea name="brief">${esc(db.project.brief)}</textarea></label><label>核心体验<textarea name="coreExperience">${esc(db.project.coreExperience)}</textarea></label><label>最终记忆点<textarea name="finalMemory">${esc(db.project.finalMemory)}</textarea></label><label>故事合同<textarea name="story">${esc(db.project.story)}</textarea></label><label>世界规则<textarea name="world">${esc(db.bible.world)}</textarea></label><label>主体规则<textarea name="character">${esc(db.bible.character)}</textarea></label><label>视觉基调<textarea name="tone">${esc(db.bible.tone)}</textarea></label><label>连续性<textarea name="continuity">${esc(db.bible.continuity)}</textarea></label><button class="btn primary">保存</button></form></div>`}
function shots(){return`<div class="grid">${db.shots.map(s=>`<div class="card shot ${db.selectedShot===s.id?'selected':''}" data-shot="${s.id}"><span class="badge status ${s.status}">${s.status}</span><span class="eyebrow">SHOT</span><h3>${esc(s.name)}</h3><div class="field"><b>Purpose</b>${esc(s.purpose)}</div><div class="field"><b>Start → End</b>${esc(s.start)} → ${esc(s.end)}</div><div class="field"><b>Camera</b>${esc(s.camera)}</div></div>`).join('')}</div><div class="sectionTitle">编辑当前 Shot</div>${shotForm(selected())}`}
function shotForm(s){return`<div class="panel"><form id="shotForm"><label>镜头名称<input name="name" value="${esc(s.name)}"></label><label>Purpose<textarea name="purpose">${esc(s.purpose)}</textarea></label><label>Start State<textarea name="start">${esc(s.start)}</textarea></label><label>Motion<textarea name="motion">${esc(s.motion)}</textarea></label><label>End State<textarea name="end">${esc(s.end)}</textarea></label><label>Camera<textarea name="camera">${esc(s.camera)}</textarea></label><label>Blocking<textarea name="blocking">${esc(s.blocking)}</textarea></label><label>画面设计<textarea name="visual">${esc(s.visual)}</textarea></label><label>声音<textarea name="sound">${esc(s.sound)}</textarea></label><label>状态<select name="status">${['DESIGN','READY','IN_PRODUCTION','REVIEW','LOCKED'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn primary">保存 Shot</button></form></div>`}
function workspace(){const s=selected(),n=shotNext(s),gens=db.generations.filter(g=>g.shotId===s.id),rs=db.reviews.filter(r=>r.shotId===s.id),ds=db.decisions.filter(d=>!d.shotId||d.shotId===s.id);return`<div class="next"><b>现在该做什么</b><span>${n[0]}</span><p class="muted">${n[1]}</p></div><div class="grid"><div class="panel"><h3>Director Contract</h3><div class="field"><b>Purpose</b>${esc(s.purpose)}</div><div class="field"><b>Start</b>${esc(s.start)}</div><div class="field"><b>Motion</b>${esc(s.motion)}</div><div class="field"><b>End</b>${esc(s.end)}</div><div class="field"><b>Camera</b>${esc(s.camera)}</div><div class="field"><b>Blocking</b>${esc(s.blocking)}</div></div><div class="panel"><h3>Locked Decisions</h3>${ds.length?ds.map(d=>`<div class="field"><b>${esc(d.title)}</b>${esc(d.decision)}</div>`).join(''):'<p class="muted">暂无决策</p>'}</div><div class="panel"><h3>Current Prompt</h3><pre style="white-space:pre-wrap;font-size:11px;line-height:1.55;color:#aeb8c7">${esc(compilePrompt(s))}</pre></div><div class="panel"><h3>History</h3><div class="timeline">${[...gens.map(g=>({t:'GENERATION',d:g.createdAt,v:g.platform+' · '+g.notes})),...rs.map(r=>({t:'REVIEW',d:r.createdAt,v:r.result+' · '+r.action+' · '+r.comments}))].sort((a,b)=>String(b.d).localeCompare(String(a.d))).map(x=>`<div><span class="eyebrow">${x.t}</span><p>${esc(x.v)}</p><small>${esc(x.d)}</small></div>`).join('')||'<p class="muted">暂无生产历史</p>'}</div></div></div>`}
function assets(){return`<div class="panel"><h3>本地素材回流</h3><form id="assetForm"><label>选择文件<input name="file" type="file" accept="image/*,video/*,audio/*"></label><label>资产名称<input name="name" placeholder="例如：龙宫世界图 v1"></label><label>来源<input name="source" placeholder="Higgsfield / Shotlab / 本地后期"></label><label>这一版改了什么<textarea name="note"></textarea></label><button class="btn primary">登记资产</button></form></div><div class="sectionTitle">Asset Library</div>${db.assets.length?`<div class="grid">${db.assets.map(a=>`<div class="card">${a.preview&&a.type==='image'?`<img class="filePreview" src="${a.preview}">`:''}<h3>${esc(a.name)}</h3><span class="badge">${esc(a.type)}</span><div class="field"><b>来源</b>${esc(a.source)}</div><div class="field"><b>本轮变化</b>${esc(a.note)}</div></div>`).join('')}</div>`:'<div class="empty">还没有回流资产</div>'}`}
function production(){const s=selected();return`<div class="panel"><h3>External Production Return</h3><p class="muted">在 Higgsfield / Shotlab / Runway / ComfyUI / Seedance 网页端做完后，把结果和上下文登记回来。</p><form id="genForm"><label>对应 Shot<select name="shotId">${db.shots.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>平台<input name="platform" placeholder="Higgsfield / Shotlab / Seedance"></label><label>模型<input name="model" placeholder="Seedance 2.5 / Kling / Veo"></label><label>结果 URL<input name="url" placeholder="可留空，仅登记流程"></label><label>当时 Prompt<textarea name="prompt"></textarea></label><label>这轮为什么生成 / 改了什么<textarea name="notes"></textarea></label><button class="btn primary">登记并进入待审片</button></form></div><div class="sectionTitle">Generation History</div>${db.generations.length?`<div class="grid">${[...db.generations].reverse().map(g=>`<div class="card"><span class="badge">SUCCEEDED</span><h3>${esc(shot(g.shotId)?.name||'Shot')}</h3><div class="field"><b>平台</b>${esc(g.platform)}</div><div class="field"><b>模型</b>${esc(g.model)}</div><div class="field"><b>本轮变化</b>${esc(g.notes)}</div></div>`).join('')}</div>`:'<div class="empty">暂无 Generation</div>'}`}
function review(){const pending=db.generations.filter(g=>shot(g.shotId)?.status==='REVIEW');return`<div class="panel"><h3>Review & Diagnosis</h3>${pending.length?`<form id="reviewForm"><label>Generation<select name="genId">${pending.map(g=>`<option value="${g.id}">${esc(shot(g.shotId).name)} · ${esc(g.platform)}</option>`).join('')}</select></label><label>结论<select name="result"><option>PASS</option><option>FAIL</option></select></label><label>下一步<select name="action"><option>KEEP</option><option>FIX_IN_POST</option><option>EDIT</option><option>REROLL</option><option>REWRITE</option></select></label><label>问题标签<input name="tags" placeholder="scale / world-density / ending"></label><label>诊断<textarea name="comments" placeholder="现象 → 原因 → 处理"></textarea></label><button class="btn primary">保存审片结论</button></form>`:'<p class="muted">当前没有待审片 Generation。</p>'}</div><div class="sectionTitle">Review History</div>${db.reviews.length?`<div class="grid">${[...db.reviews].reverse().map(r=>`<div class="card"><h3>${esc(shot(r.shotId)?.name||'Shot')}</h3><span class="badge">${r.result} · ${r.action}</span><div class="field"><b>问题</b>${esc(r.tags)}</div><div class="field"><b>诊断</b>${esc(r.comments)}</div></div>`).join('')}</div>`:'<div class="empty">暂无审片记录</div>'}`}
function decisions(){return`<div class="panel"><h3>Decision Log</h3><form id="decisionForm"><label>关联 Shot<select name="shotId"><option value="">整个项目</option>${db.shots.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>决策标题<input name="title" placeholder="例如：完整真龙只在结尾出现"></label><label>最终决定<textarea name="decision"></textarea></label><label>为什么<textarea name="reason"></textarea></label><label>状态<select name="status"><option>LOCKED</option><option>ACTIVE</option><option>SUPERSEDED</option></select></label><button class="btn primary">保存决策</button></form></div><div class="sectionTitle">已沉淀决策</div><div class="grid">${db.decisions.map(d=>`<div class="card"><span class="badge">${d.status}</span><h3>${esc(d.title)}</h3><div class="field"><b>决定</b>${esc(d.decision)}</div><div class="field"><b>原因</b>${esc(d.reason)}</div></div>`).join('')}</div>`}
function render(){nav();const names={dashboard:'控制台',bible:'创作圣经',shots:'镜头设计',workspace:'镜头工作区',assets:'资产 / Reference',production:'生产 / 回流',review:'审片 / Diagnosis',decisions:'决策日志'};$('#title').textContent=names[current];$('#subtitle').textContent=db.project.name+' · '+db.project.coreExperience;$('#view').innerHTML=({dashboard,bible,shots,workspace,assets,production,review,decisions}[current])();bind()}
function bind(){const f=id=>$('#'+id);if(f('goWorkspace'))f('goWorkspace').onclick=()=>{current='workspace';render()};if(f('bibleForm'))f('bibleForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));Object.assign(db.project,{brief:x.brief,coreExperience:x.coreExperience,finalMemory:x.finalMemory,story:x.story});Object.assign(db.bible,{world:x.world,character:x.character,tone:x.tone,continuity:x.continuity});save();toast('已保存');render()};document.querySelectorAll('[data-shot]').forEach(x=>x.onclick=()=>{db.selectedShot=x.dataset.shot;save();render()});if(f('shotForm'))f('shotForm').onsubmit=e=>{e.preventDefault();Object.assign(selected(),Object.fromEntries(new FormData(e.target)));save();toast('Shot 已保存');render()};if(f('assetForm'))f('assetForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),file=fd.get('file'),a={id:uid(),name:fd.get('name')||file?.name||'未命名素材',source:fd.get('source')||'手机本地',note:fd.get('note')||'',type:file?.type?.split('/')[0]||'file',preview:'',createdAt:now()};if(file&&file.size&&file.size<1200000&&file.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{a.preview=r.result;db.assets.push(a);save();render()};r.readAsDataURL(file)}else{db.assets.push(a);save();render()}toast('资产已登记')};if(f('genForm'))f('genForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target)),s=shot(x.shotId);db.generations.push({id:uid(),shotId:x.shotId,platform:x.platform||'External',model:x.model||'',url:x.url||'',prompt:x.prompt||'',notes:x.notes||'',createdAt:now()});if(s)s.status='REVIEW';save();toast('已进入待审片');render()};if(f('reviewForm'))f('reviewForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target)),g=db.generations.find(v=>v.id===x.genId),s=shot(g.shotId);db.reviews.push({id:uid(),shotId:g.shotId,genId:g.id,result:x.result,action:x.action,tags:x.tags,comments:x.comments,createdAt:now()});if(s)s.status=x.result==='PASS'&&['KEEP','FIX_IN_POST'].includes(x.action)?'LOCKED':'READY';save();toast('审片结论已保存');render()};if(f('decisionForm'))f('decisionForm').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));db.decisions.push({id:uid(),...x,createdAt:now()});save();toast('决策已沉淀');render()}}
$('#exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ai-video-director-mobile-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#resetBtn').onclick=()=>{if(confirm('重置手机 Demo 到初始龙宫示例？')){db=seed();save();current='dashboard';render()}};render();
</script></body></html>
