name: Stabilize PWA v1.8.0

on:
  push:
    branches: [master]
    paths:
      - 'stabilize-v180.py'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.8.0 architecture cleanup
        run: python3 stabilize-v180.py

      - name: Validate runtime JavaScript
        run: |
          for f in api.js sync.js merge-cloud-history.js app.js seedance25.js seedance25-refvideo-hotfix.js video-task-manager.js pwa-update.js sw.js; do
            node --check "$f"
          done

      - name: Commit stabilized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "stabilize PWA architecture v1.8.0"
            git push origin master
          fi
