name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean production site
        run: |
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          BUILD_ID="$(date +%s)"
          export BUILD_TIME BUILD_ID
          echo "Build: $BUILD_TIME | ID: $BUILD_ID"

          rm -rf _site
          mkdir -p _site
          cp index.html style.css api.js sync.js merge-cloud-history.js app.js seedance25.js seedance-audio-url.js seedance25-refvideo-hotfix.js video-task-manager.js pwa-update.js sw.js manifest.json _site/

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          site = Path('_site')
          build_id = os.environ['BUILD_ID']
          build_time = os.environ['BUILD_TIME']

          # Source app.js already contains the stabilized startup flow.
          # Build only stamps version/build metadata; do not rewrite runtime startup code.
          p = site / 'app.js'
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r"const APP_VERSION = '[^']*';", "const APP_VERSION = '1.8.2';", s, count=1)
          if n != 1:
              raise RuntimeError('APP_VERSION anchor missing')
          s, n = re.subn(r"const APP_BUILD = '[^']*';", f"const APP_BUILD = '{build_time}';", s, count=1)
          if n != 1:
              raise RuntimeError('APP_BUILD anchor missing')
          p.write_text(s, encoding='utf-8')

          # Stamp visible version and cache-busting build id into the production HTML.
          p = site / 'index.html'
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'<link rel="stylesheet" href="style\.css(?:\?[^\"]*)?">', f'<link rel="stylesheet" href="style.css?v={build_id}">', s, count=1)
          if n != 1:
              raise RuntimeError('style.css anchor missing')
          s, n = re.subn(r'<span id="versionText">[^<]*</span>', '<span id="versionText">v1.8.2</span>', s, count=1)
          if n != 1:
              raise RuntimeError('versionText anchor missing')
          s, n = re.subn(r'<span id="versionDate">[^<]*</span>', f'<span id="versionDate">{build_time}</span>', s, count=1)
          if n != 1:
              raise RuntimeError('versionDate anchor missing')

          scripts = f'''  <script src="api.js?v={build_id}"></script>\n  <script src="sync.js?v={build_id}"></script>\n  <script src="merge-cloud-history.js?v={build_id}"></script>\n  <script src="app.js?v={build_id}"></script>\n  <script src="seedance25.js?v={build_id}"></script>\n  <script src="seedance-audio-url.js?v={build_id}"></script>\n  <script src="seedance25-refvideo-hotfix.js?v={build_id}"></script>\n  <script src="video-task-manager.js?v={build_id}"></script>\n  <script src="pwa-update.js?v={build_id}"></script>\n'''
          start = s.find('  <script src="api.js')
          end = s.find('</body>', start)
          if start < 0 or end < 0:
              raise RuntimeError('index script block missing')
          s = s[:start] + scripts + s[end:]
          p.write_text(s, encoding='utf-8')

          # Every deployment gets a fresh service-worker cache namespace.
          p = site / 'sw.js'
          s = p.read_text(encoding='utf-8')
          if '__BUILD_ID__' not in s:
              raise RuntimeError('service worker build-id anchor missing')
          s = s.replace('__BUILD_ID__', build_id)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate production runtime
        run: |
          for f in api.js sync.js merge-cloud-history.js app.js seedance25.js seedance-audio-url.js seedance25-refvideo-hotfix.js video-task-manager.js pwa-update.js sw.js; do
            node --check "_site/$f"
          done
          echo "Runtime scripts:"
          grep -o '<script[^>]*src="[^"]*"' _site/index.html
          if grep -Eq 'nav-rescue|emergency-touch-unlock|manual-update-control|sw-update-video-safe-hotfix|video-task-background-hotfix|video-task-pending-ui-hotfix|history-video-task-hotfix' _site/index.html; then
            echo "Obsolete hotfix leaked into production" >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
