name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject build version
        run: |
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          CACHE_VER="volc-ai-$(date +%s)"
          echo "Build: $BUILD_TIME | Cache: $CACHE_VER"
          sed -i "s|APP_BUILD = '[^']*'|APP_BUILD = '$BUILD_TIME'|g" app.js
          sed -i "s|CACHE_NAME = '[^']*'|CACHE_NAME = '$CACHE_VER'|g" sw.js
          sed -i "s|<span id=\"versionDate\">[^<]*</span>|<span id=\"versionDate\">$BUILD_TIME</span>|g" index.html

          # 修复导航初始化竞态：导航事件在异步启动前已绑定，但原选择模式变量要到后半段才声明。
          sed -i '/^let isSelectMode = false;/d' app.js
          sed -i '/^let selectedRecords = \[\];/d' app.js
          sed -i '/^let playlistVideos = \[\];/d' app.js
          sed -i '/^let playlistIndex = 0;/d' app.js
          sed -i '/^let playlistVideoEl = null;/d' app.js
          sed -i '/^let playlistVideoEl2 = null;/d' app.js
          sed -i '/^let playlistActiveEl = null;/d' app.js
          sed -i '/^let playlistPreloadedIdx = -1;/d' app.js
          sed -i '/^const videoGenState = { isGenerating: false };/a\let isSelectMode = false;\nlet selectedRecords = [];\nlet playlistVideos = [];\nlet playlistIndex = 0;\nlet playlistVideoEl = null;\nlet playlistVideoEl2 = null;\nlet playlistActiveEl = null;\nlet playlistPreloadedIdx = -1;' app.js

          if grep -q 'seedance25.js' index.html; then
            sed -i "s|seedance25.js?v=[^\"]*|seedance25.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"seedance25.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'seedance25-refvideo-hotfix.js' index.html; then
            sed -i "s|seedance25-refvideo-hotfix.js?v=[^\"]*|seedance25-refvideo-hotfix.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"seedance25-refvideo-hotfix.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'video-task-background-hotfix.js' index.html; then
            sed -i "s|video-task-background-hotfix.js?v=[^\"]*|video-task-background-hotfix.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"video-task-background-hotfix.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'video-task-pending-ui-hotfix.js' index.html; then
            sed -i "s|video-task-pending-ui-hotfix.js?v=[^\"]*|video-task-pending-ui-hotfix.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"video-task-pending-ui-hotfix.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'history-video-task-hotfix.js' index.html; then
            sed -i "s|history-video-task-hotfix.js?v=[^\"]*|history-video-task-hotfix.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"history-video-task-hotfix.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'sw-update-video-safe-hotfix.js' index.html; then
            sed -i "s|sw-update-video-safe-hotfix.js?v=[^\"]*|sw-update-video-safe-hotfix.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"sw-update-video-safe-hotfix.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'app-build-version.js' index.html; then
            sed -i "s|app-build-version.js?v=[^\"]*|app-build-version.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"app-build-version.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'manual-update-control.js' index.html; then
            sed -i "s|manual-update-control.js?v=[^\"]*|manual-update-control.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"manual-update-control.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          if grep -q 'emergency-touch-unlock.js' index.html; then
            sed -i "s|emergency-touch-unlock.js?v=[^\"]*|emergency-touch-unlock.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"emergency-touch-unlock.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

          # 最后一层独立导航兜底：iOS touch/click 直接切 section，不依赖 app.js 的异步状态。
          if grep -q 'nav-rescue.js' index.html; then
            sed -i "s|nav-rescue.js?v=[^\"]*|nav-rescue.js?v=$CACHE_VER|g" index.html
          else
            sed -i "s|</body>|  <script src=\"nav-rescue.js?v=$CACHE_VER\"></script>\n</body>|" index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
