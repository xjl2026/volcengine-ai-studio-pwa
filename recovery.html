<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>PWA 强制更新</title>
  <style>
    html,body{margin:0;min-height:100%;background:#11131b;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 40px}
    .card{background:#191c27;border:1px solid #2b3040;border-radius:18px;padding:22px}
    h1{font-size:22px;margin:0 0 12px}
    p{color:#b8bfd1;line-height:1.65;font-size:15px}
    .note{padding:12px 14px;border-radius:12px;background:rgba(0,214,143,.08);color:#84e5c5;font-size:14px;line-height:1.6;margin:16px 0}
    button{width:100%;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:700;background:#10d6b0;color:#09241d}
    button:disabled{opacity:.55}
    #status{margin-top:16px;color:#ffcf70;font-size:14px;line-height:1.6;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>PWA 强制更新</h1>
      <p>用于解决 iPhone 已安装 PWA 长时间停留在旧版本的问题。</p>
      <div class="note">只注销旧 Service Worker，并删除本应用的 Cache Storage。不会主动清理 localStorage、IndexedDB、历史记录、提示词、任务 ID 或设置。</div>
      <button id="repair">强制更新到最新版</button>
      <div id="status">准备就绪</div>
    </div>
  </div>
  <script>
    (function(){
      const btn=document.getElementById('repair');
      const status=document.getElementById('status');
      async function repair(){
        btn.disabled=true;
        status.textContent='正在注销旧 Service Worker…';
        try{
          if('serviceWorker' in navigator){
            const regs=await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
          }
          status.textContent='正在清理旧缓存…';
          if('caches' in window){
            const keys=await caches.keys();
            await Promise.all(keys.filter(k=>k.startsWith('volc-ai-')).map(k=>caches.delete(k)));
          }
          status.textContent='清理完成，正在进入最新版…';
          const target=new URL('./',location.href);
          target.searchParams.set('__force_update',Date.now().toString());
          setTimeout(()=>location.replace(target.href),350);
        }catch(err){
          console.error(err);
          status.textContent='自动更新失败：'+(err&&err.message?err.message:'未知错误')+'\n请截图发给我。';
          btn.disabled=false;
        }
      }
      btn.addEventListener('click',repair);
    })();
  </script>
</body>
</html>
